<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电脑异常修复 · KSR</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 4.5a6.5 6.5 0 0 0-8.2 8.2L4.6 19.9a2.6 2.6 0 0 0 0 3.7l3.8 3.8a2.6 2.6 0 0 0 3.7 0l7.2-7.2A6.5 6.5 0 0 0 27.5 12"/>
          <path d="m22.5 9.5 3 3"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">电脑异常修复</div>
        <div class="brand-sub">KSR · 开源版</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <div id="pack-info">规则包加载中…</div>
      <div class="side-foot-links">
        <a href="#" id="lnk-about">关于</a>
        <span>·</span>
        <a href="#" id="lnk-license">开源许可</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="warn-strip" id="warn-strip" hidden></div>
      <div class="topbar-right">
        <a href="#" class="top-link" id="lnk-issues">使用说明</a>
        <span class="top-sep"></span>
        <a href="#" class="top-link" id="lnk-repo">关于</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-icon" id="hero-icon">
        <svg viewBox="0 0 56 56" fill="none">
          <rect x="9" y="11" width="40" height="28" rx="2.6" fill="#EAF2FF"
                stroke="#9CBCE8" stroke-width="1.6"/>
          <rect x="14" y="16" width="30" height="18" rx="1.4" fill="#fff"
                stroke="#C6D8F0" stroke-width="1.2"/>
          <path d="M22 44.5h13M28.5 39v5.5" stroke="#9CBCE8" stroke-width="1.8"
                stroke-linecap="round"/>
          <circle cx="13" cy="13" r="8.6" fill="#FF5A4E" stroke="#fff"
                  stroke-width="1.9"/>
          <path d="M13 9.1v4.3M13 16.5v.2" stroke="#fff" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </div>
      <div class="hero-text">
        <h1 id="hero-title">正在检测…</h1>
        <p id="hero-sub">检出项可能会导致软件和游戏运行异常，影响电脑使用</p>
      </div>
      <div class="hero-actions">
        <button class="row-btn" id="btn-startup">启动项管理</button>
        <button class="row-btn" id="btn-diagnose">诊断应用</button>
        <button class="row-btn" id="btn-history">修复记录</button>
        <a href="#" class="rescan" id="btn-rescan">重新检测</a>
        <button class="btn-primary" id="btn-fix" disabled>修复所选项</button>
      </div>
    </section>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- 说明弹层 -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title"></span>
      <button class="modal-x" id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
